<text x="80" y="890" class="note" >PK = khóa chính; FK = khóa ngoại. Màu xanh lá: ba bảng được bổ sung vào mô hình trang 3.</text>
<text x="80" y="918" class="note" >FK TV–Quyền hạn: DELETE CASCADE. FK Đánh giá và Ban chuyên môn: DELETE RESTRICT.</text>
<text x="80" y="946" class="note" >Tất cả FK ở đây: UPDATE CASCADE. Thành viên bắt buộc thuộc một ban; mỗi đánh giá bắt buộc có một MSV.</text>
