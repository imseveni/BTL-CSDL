<title id="title">Mô hình quan hệ bổ sung phần nhân sự – Đông</title>
<desc id="desc">Ban chuyên môn liên kết một nhiều với Thành viên. Quyền hạn liên kết nhiều nhiều với Thành viên qua bảng ThanhVien_QuyenHan. Mỗi Đánh giá thuộc một Thành viên.</desc>
